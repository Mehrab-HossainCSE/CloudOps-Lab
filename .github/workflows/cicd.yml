name: CI/CD - Build, Push & Deploy (App + Monitoring)

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/usermanagement-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/usermanagement-frontend

jobs:
  # ---------------------------------------------------------
  # 1. Build & push both images
  # ---------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.BACKEND_IMAGE }}:latest ./Backend
          docker push ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ env.FRONTEND_IMAGE }}:latest ./Frontend
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ---------------------------------------------------------
  # 2. Deploy Application stack first
  # ---------------------------------------------------------
  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy compose file to EC2
        run: |
          echo "${{ secrets.AWS_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -o StrictHostKeyChecking=no -i private_key.pem \
            docker-compose.yml \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${{ vars.DEPLOY_PATH }}/docker-compose.yml

      - name: Deploy Application to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << EOF

            # ── Install Docker if not present ──────────────────────────
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release

              sudo mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
                sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

              echo \
                "deb [arch=\$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu \
                \$(lsb_release -cs) stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

              sudo systemctl start docker
              sudo systemctl enable docker
              sudo usermod -aG docker \$USER
              echo "Docker installed successfully."
            else
              echo "Docker already installed. Skipping."
            fi

            cd ${{ vars.DEPLOY_PATH }}

            # NOTE: the "observability" network (incident-observability) is
            # created manually on this host ahead of time and is NOT touched here.

            echo "${{ secrets.DOCKER_PASSWORD }}" | \
              sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            sudo BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest \
                 FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:latest \
                 docker compose -f docker-compose.yml pull

            sudo BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:latest \
                 FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:latest \
                 docker compose -f docker-compose.yml up -d

          EOF

  # ---------------------------------------------------------
  # 3. Deploy Monitoring stack second (depends on app network)
  # ---------------------------------------------------------
  deploy-monitoring:
    runs-on: ubuntu-latest
    needs: deploy-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy monitoring folder to EC2
        run: |
          echo "${{ secrets.AWS_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          # -r copies the whole monitoring/ tree: compose.monitoring.yaml PLUS
          # prometheus/, loki/, alloy/, grafana/provisioning, grafana/dashboards
          # which the compose file mounts as relative-path volumes.
          scp -r -o StrictHostKeyChecking=no -i private_key.pem \
            monitoring \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${{ vars.DEPLOY_PATH }}/monitoring

      - name: Deploy Monitoring to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} << EOF

            cd ${{ vars.DEPLOY_PATH }}/monitoring

            printf 'GRAFANA_ADMIN_USER=%s\n' "${{ secrets.GRAFANA_ADMIN_USER }}" > .env.monitoring
            printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env.monitoring

            sudo docker compose -f compose.monitoring.yaml --env-file .env.monitoring up -d

          EOF